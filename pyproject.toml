[project]
name = "leadengine"
version = "0.1.0"
description = "Inbound lead engine: dedupe, enrich, score, route, upsert to the CRM and draft a first email that waits for approval"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
live = ["anthropic>=1,<2"]

[tool.setuptools]
packages = ["leadengine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
